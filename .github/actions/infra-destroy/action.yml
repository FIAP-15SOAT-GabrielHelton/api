name: 'Infra Destroy'
description: 'Remove recursos K8s e destrói toda a infraestrutura AWS via Terraform (VPC, EKS, RDS, ECR)'

inputs:
  aws_access_key_id:
    description: 'AWS Access Key ID'
    required: true
  aws_secret_access_key:
    description: 'AWS Secret Access Key'
    required: true
  aws_session_token:
    description: 'AWS Session Token'
    required: true
  db_password:
    description: 'Password do RDS PostgreSQL'
    required: true

runs:
  using: composite
  steps:
    # Mascara os inputs sensíveis nos logs de todos os steps subsequentes deste job.
    - name: Mask Sensitive Credentials
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.aws_access_key_id }}"
        echo "::add-mask::${{ inputs.aws_secret_access_key }}"
        echo "::add-mask::${{ inputs.aws_session_token }}"
        echo "::add-mask::${{ inputs.db_password }}"

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-session-token: ${{ inputs.aws_session_token }}
        aws-region: us-east-1

    # Mesmo bootstrap do cd_deploy.yml: deriva o nome do bucket pelo Account ID
    # (garante unicidade global) e reutiliza se já existir.
    - name: Bootstrap S3 Backend
      shell: bash
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        TF_BUCKET="oficina-mecanica-tfstate-${ACCOUNT_ID}"
        echo "TF_BUCKET=$TF_BUCKET" >> "$GITHUB_ENV"

    # terraform_wrapper: false evita texto extra no stdout capturado pelo terraform output.
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7
        terraform_wrapper: false

    # Remove os recursos K8s primeiro para liberar Load Balancers e IPs elásticos
    # antes de destruir a infra — evita que o terraform destroy trave por dependências.
    # O if no eks update-kubeconfig torna o destroy idempotente: funciona mesmo se
    # o cluster já foi deletado (ex: segunda execução ou falha parcial anterior).
    - name: Cleanup K8s & Destroy Infrastructure
      shell: bash
      env:
        TF_VAR_db_password: ${{ inputs.db_password }}
      run: |
        cd infra/
        terraform init \
          -backend-config="bucket=$TF_BUCKET" \
          -backend-config="key=oficina-mecanica/terraform.tfstate" \
          -backend-config="region=us-east-1"

        # Tenta extrair o nome do cluster do state; usa fallback se o state não existir
        CLUSTER_NAME=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "oficina-mecanica-cluster")

        if aws eks update-kubeconfig --name "$CLUSTER_NAME" --region us-east-1 2>/dev/null; then
          echo "Conectado ao EKS. Limpando recursos..."
          kubectl delete hpa/oficina-mecanica-hpa svc/oficina-mecanica-web-service deployment/oficina-mecanica-web deployment/oficina-mecanica-jobs job/oficina-mecanica-db-prepare secret/oficina-mecanica-secrets configmap/oficina-mecanica-config --ignore-not-found=true

          # Aguarda a AWS liberar fisicamente os Load Balancers antes de destruir a VPC
          echo "Aguardando 120s para a AWS liberar fisicamente os Load Balancers e IPs..."
          sleep 120
        else
          echo "Cluster não foi encontrado ou já está deletado. Prosseguindo direto para o destroy..."
        fi

        # O aws_ecr_repository falha no terraform destroy se ainda houver imagens —
        # force_destroy não existe no provider hashicorp/aws, então esvaziamos via CLI.
        echo "Esvaziando repositório ECR antes do destroy..."
        IMAGE_IDS=$(aws ecr list-images \
          --repository-name oficina-mecanica \
          --region us-east-1 \
          --query 'imageIds[*]' \
          --output json 2>/dev/null || echo "[]")
        if [ "$IMAGE_IDS" != "[]" ] && [ "$IMAGE_IDS" != "null" ] && [ -n "$IMAGE_IDS" ]; then
          aws ecr batch-delete-image \
            --repository-name oficina-mecanica \
            --region us-east-1 \
            --image-ids "$IMAGE_IDS"
        fi

        terraform destroy -auto-approve

        # Remove o bucket S3 do backend — o terraform destroy já gravou o state
        # final antes de sair, então é seguro deletar o bucket agora.
        echo "Removendo bucket S3 do backend Terraform..."
        aws s3 rb "s3://${TF_BUCKET}" --force 2>/dev/null || echo "Bucket já removido ou inacessível."
